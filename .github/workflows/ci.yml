# .github/workflows/ci.yml
# EEE 项目持续集成：语法检查 + ESLint + 单元测试
#
# 触发：push 到 main / 向 main 提交 PR / 手动触发
# 环境：ubuntu-latest + Node 20（LTS）
# 说明：项目本身无构建步骤，CI 只做质量门禁

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装开发依赖
        run: npm install

      - name: JS 语法检查
        run: |
          find js -name "*.js" ! -name "jszip.min.js" -exec node --check {} \;
          node --check bump-version.js

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test