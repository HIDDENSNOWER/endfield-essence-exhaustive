<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTable · 完整版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏（不变） -->
    <nav class="navbar">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="筛选行或数值...">
        </div>
        <button class="btn-icon" id="btnToggleTheme" title="切换主题">
            <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </nav>

    <!-- 主内容区（不变） -->
    <div class="main-layout">
        <div class="table-area" id="tableArea">
            <div class="table-section" id="section1">
                <div class="section-title">▸ 第一部分（强攻 ~ 残暴）</div>
                <div class="main-container">
                    <div class="table-wrapper"><table><thead id="tableHead1"></thead><tbody id="tableBody1"></tbody></table></div>
                </div>
            </div>
            <div class="table-section" id="section2">
                <div class="section-title">▸ 第二部分（附术 ~ 效益）</div>
                <div class="main-container">
                    <div class="table-wrapper"><table><thead id="tableHead2"></thead><tbody id="tableBody2"></tbody></table></div>
                </div>
            </div>
        </div>

        <!-- 右侧输入面板（调整顺序与标签） -->
        <aside class="input-panel" id="inputPanel">
            <div class="panel-title">📝 数据管理</div>
            <div class="dataset-info">
                <span class="dataset-label">当前数据集：</span>
                <span class="dataset-name" id="datasetName">smarttable_data</span>
            </div>
            <div class="form-group">
                <label>切换数据集</label>
                <select id="datasetSelect"></select>
            </div>
            <div class="action-buttons">
                <button class="btn btn-sm" id="btnExport">导出</button>
                <button class="btn btn-sm" id="btnImport">导入</button>
                <button class="btn btn-sm" id="btnNewDataset">新建</button>
                <button class="btn btn-sm" id="btnRename">重命名</button>
                <button class="btn btn-sm btn-danger" id="btnDeleteDataset">删除</button>
            </div>
            <!-- ★ 顺序改为：主词条 → 副词条 → 词条 -->
            <div class="form-group">
                <label>主词条</label>
                <select id="inputSubCol"></select>
            </div>
            <div class="form-group">
                <label>副词条</label>
                <select id="inputRow"></select>
            </div>
            <div class="form-group">
                <label>词条</label>
                <select id="inputGroup"></select>
            </div>
            <div class="form-group">
                <label>数值</label>
                <input type="text" id="inputValue" placeholder="输入数值" maxlength="3" pattern="\d{3}" inputmode="numeric">
            </div>
            <button class="btn btn-primary btn-block" id="btnApplyValue">应用</button>
            <button class="btn btn-block btn-clear" id="btnClearAll">清空当前数据集</button>
            <p class="input-hint" id="inputHint"></p>
            <input type="file" id="importFile" accept=".json" style="display:none;">
        </aside>
    </div>

    <!-- 数值对比弹窗（不变） -->
    <div class="modal-overlay" id="modalCompare" style="display:none;">
        <div class="modal" style="max-width:450px;">
            <div class="modal-header">
                <span>📊 数值对比</span>
                <button class="btn-icon btn-sm" id="btnCloseCompare" style="border:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="compareBody"></div>
            <div class="modal-footer">
                <button class="btn" id="btnKeepOld">保留旧值</button>
                <button class="btn btn-primary" id="btnReplaceNew">替换为新值</button>
            </div>
        </div>
    </div>

    <!-- 二次确认弹窗 -->
    <div class="modal-overlay" id="modalConfirm" style="display:none;">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <span>⚠️ 操作确认</span>
                <button class="btn-icon btn-sm" id="btnCloseConfirm" style="border:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-footer">
                <button class="btn" id="btnCancelConfirm">取消</button>
                <button class="btn btn-primary" id="btnConfirmAction">确认</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
